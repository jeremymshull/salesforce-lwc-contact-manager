<template>
  <lightning-card title="Related Contacts" icon-name="standard:contact">
    <div>
      <c-contact-input-form
        onnewcontact={handleNewContact}
        account-id={recordId}>
      </c-contact-input-form>
    </div>
    <div>
      <lightning-datatable
        key-field="Id"
        data={contacts}
        columns={columns}
        hide-checkbox-column>
      </lightning-datatable>
    </div>
  </lightning-card>    
</template>
